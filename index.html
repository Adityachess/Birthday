<!DOCTYPE html>
<html>
<head>
    <title>Happy Birthday Ankita 👑💖</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Floating Panda Stickers -->
<div class="pandas">
🐼✨ 👑 🐼 💖 🐼 🌸 👑 🐼 💅 🐼 🎀 🐼 💕 🐼
</div>

<!-- Loading Screen -->
<div id="loadingScreen">
    <h1>Loading Love Engine for Queen Ankita 👑💖✨</h1>
</div>

<div class="container hidden" id="mainContent">

    <!-- Password Section -->
    <div id="passwordSection">
        <h2>🔒 Only Ankita Can Unlock This 👑</h2>
        <input type="password" id="passwordInput" placeholder="Enter Secret Name 💕">
        <button onclick="checkPassword()">Unlock 💖</button>
        <p id="wrongPassword"></p>
    </div>

    <!-- Start Button -->
    <button id="startBtn" class="hidden">Start the Surprise 🐼💖</button>

    <!-- Quiz -->
    <div id="quiz" class="hidden">
        <h2 id="question"></h2>
        <div id="options"></div>
    </div>

    <!-- Memories -->
<div id="memorySection" class="hidden">
    <h2 class="sparkle">Our Beautiful Memories 👑💖✨</h2>

    <div class="slideshow-container">

        <div class="slide fade">
            <img src="images/photo1.PNG">
            <div class="caption">Our cutest memory ever 🐼💖</div>
        </div>

        <div class="slide fade">
            <img src="images/photo2.JPG">
            <div class="caption">My favorite human being 👑✨</div>
        </div>

        <div class="slide fade">
            <img src="images/photo3.JPG">
            <div class="caption">Forever looks good on us 💕</div>
        </div>

        <div class="slide fade">
            <img src="images/photo4.JPG">
            <div class="caption">We in traditionals 💕</div>
        </div>

        <!-- Arrows -->
        <a class="prev" onclick="changeSlide(-1)">❮</a>
        <a class="next" onclick="changeSlide(1)">❯</a>

    </div>

    <br>

    <div style="text-align:center">
        <span class="dot" onclick="currentSlide(1)"></span>
        <span class="dot" onclick="currentSlide(2)"></span>
        <span class="dot" onclick="currentSlide(3)"></span>
        <span class="dot" onclick="currentSlide(4)"></span>
    </div>

    <h2 id="finalMessage"></h2>
</div>

<audio id="bgMusic" loop>
    <source src="gehra_hua.mp3" type="audio/mp3">
</audio>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script src="script.js"></script>

</body>
</html>
